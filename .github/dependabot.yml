# 依存パッケージの更新を自動でチェックし、更新があればPRを作る設定
version: 2
updates:
  # PHPのパッケージ（composer.json / composer.lock は backend/ にある）
  - package-ecosystem: "composer"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # バックエンドのベースイメージ（backend/Dockerfile）
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
